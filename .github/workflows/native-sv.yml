name: Native SystemVerilog
on:
  pull_request:
    paths: ['sv/**', '.github/workflows/native-sv.yml']
  push:
    paths: ['sv/**', '.github/workflows/native-sv.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  catalog:
    runs-on: ubuntu-24.04
    outputs:
      shards: ${{ steps.catalog.outputs.shards }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: catalog
        run: |
          python3 sv/scripts/regression.py --check-catalog
          python3 -m unittest discover -s sv/tests/scripts -p 'test_*.py' -v
          echo "shards=$(python3 sv/scripts/regression.py --list)" >> "$GITHUB_OUTPUT"
      - name: Audit pinned original Python sources
        run: make -C sv migration-inventory
  native:
    needs: catalog
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.catalog.outputs.shards) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      JOBS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Historical baseline uses the exact cd7aad object.
      - name: Record resources
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          minimum=0
          if [[ "$SHARD" == systems || "$SHARD" == pe ]]; then minimum=14; fi
          python3 sv/scripts/preflight.py --minimum-memory-gib "$minimum" --output "sv/build/regression/$SHARD/resources.json"
      - name: Install build prerequisites
        run: sudo apt-get update && sudo apt-get install -y g++ make python3 perl curl unzip
      - name: Install SHA-verified HDL tools
        run: python3 sv/scripts/install_toolchain.py --github-env
      - name: Run native regression shard
        env:
          SHARD: ${{ matrix.shard }}
        run: python3 sv/scripts/regression.py --shard "$SHARD"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: native-sv-${{ matrix.shard }}
          path: |
            sv/build/regression/**/*.json
            sv/build/regression/**/*.log
            sv/build/toolchain/versions.json
            sv/build/current/**/*.log
            sv/build/current/**/compiled_sources.sha256
            sv/build/current/**/build-stamp.json
            sv/build/native/**/*.log
            sv/build/baseline-*/sv/build/**/*.log
          retention-days: 14
